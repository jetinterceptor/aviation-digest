name: Sync Daily Aviation Digest to GitHub Pages

on:
  schedule:
    - cron: '30 19 * * *'  # Automatically runs daily at 3:30 PM EDT (19:30 UTC)
  workflow_dispatch:       # Allows manual 1-click re-run from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest index.html from Public Drive Folder
        run: |
          curl -L "https://drive.google.com/uc?id=1MpZAPbmLk9WNB5ECSMdcBG3ExsDSTchl&export=download" -o index.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Automated update: Global Aerospace Digest" && git push)
          

name: Sync Daily Aviation Digest to GitHub Pages

on:
  schedule:
    # Runs daily at 10:15 UTC (6:15 AM EDT)
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Latest Digest HTML from Google Drive
        run: |
          # Fetch the test HTML file directly from your public folder
          curl -L -o index.html "https://drive.google.com/uc?export=download&id=1tEsTrUnF1L3iD_aViAtIoNDiGeSt_921"
          
          # Verify the download contains valid HTML to prevent blank pages
          if grep -q "<!DOCTYPE html>" index.html || grep -q "<html" index.html; then
            echo "Successfully retrieved valid HTML digest."
          else
            echo "Failed to retrieve HTML from Drive. Check folder sharing settings." >&2
            exit 1
          fi

      - name: Commit and Publish to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automated update: Commercial Aviation Digest $(date +'%Y-%m-%d')" || echo "No changes detected"
          git push
          
